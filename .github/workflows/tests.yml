name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer validate --no-check-publish

  tests:
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }} / testbench ${{ matrix.testbench }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            filament: '^3.0'
            testbench: '^8.0'
          - php: '8.2'
            filament: '^3.0'
            testbench: '^9.0'
          - php: '8.3'
            filament: '^3.0'
            testbench: '^10.0'
          - php: '8.3'
            filament: '^3.0'
            testbench: '^11.0'
          - php: '8.2'
            filament: '^4.0'
            testbench: '^9.0'
          - php: '8.3'
            filament: '^4.0'
            testbench: '^10.0'
          - php: '8.3'
            filament: '^4.0'
            testbench: '^11.0'
          - php: '8.2'
            filament: '^5.0'
            testbench: '^10.0'
          - php: '8.4'
            filament: '^5.0'
            testbench: '^11.0'
          - php: '8.5'
            filament: '^5.0'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ matrix.filament }}-${{ matrix.testbench }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-${{ matrix.filament }}-
            composer-${{ matrix.php }}-
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --no-blocking --with "filament/forms:${{ matrix.filament }}" --with "orchestra/testbench:${{ matrix.testbench }}"
      - name: Run tests
        run: composer test
